<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" fill="none">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e6e9ec"/></pattern>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(336.0 391.0) scale(240.0 506.00000000000006)">
    <stop stop-color="#1a7f37" stop-opacity="0.22"/><stop offset="1" stop-color="#1a7f37" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="r"><rect width="480" height="460" rx="16"/></clipPath>
</defs>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  .pulse { animation: p 2.4s ease-in-out infinite; }
  .pulse2 { animation: p 2.4s ease-in-out .8s infinite; }
  .pulse3 { animation: p 2.4s ease-in-out 1.6s infinite; }
  @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .drift { animation: d 16s ease-in-out infinite alternate; }
  @keyframes d { from { transform: translateX(0) } to { transform: translateX(-60px) } }
  .flow { stroke-dasharray: 4 6; animation: f 1.6s linear infinite; }
  @keyframes f { to { stroke-dashoffset: -20 } }
  .blink { animation: b 1.1s steps(1) infinite; }
  @keyframes b { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .pulse, .pulse2, .pulse3, .drift, .flow, .blink { animation: none } }
</style>
<g clip-path="url(#r)">
  <rect width="480" height="460" fill="#ffffff"/>
  <rect width="480" height="460" fill="url(#dots)"/>
  <g class="drift"><rect x="-100" width="680" height="460" fill="url(#glow)"/></g>

  <text x="32" y="56" class="m" font-size="14" fill="#1a7f37" letter-spacing="1.5">SOURCE-AVAILABLE</text>
  <text x="30" y="108" class="t" font-size="44" font-weight="700" fill="#1f2328" letter-spacing="-1.4">Quits</text>
  <text x="32" y="150" class="t" font-size="20" fill="#59636e">Invoicing for freelancers and</text><text x="32" y="176" class="t" font-size="20" fill="#59636e">small businesses. Self-hosted.</text>
  <g transform="translate(32 198)"><rect width="91" height="30" rx="15.0" fill="#1a7f37" fill-opacity="0.12" stroke="#1a7f37" stroke-opacity="0.35"/><text x="45" y="20.4" text-anchor="middle" class="m" font-size="15" fill="#1a7f37">TanStack</text></g>
<g transform="translate(130.8 198)"><rect width="54" height="30" rx="15.0" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-opacity="0.35"/><text x="27" y="20.4" text-anchor="middle" class="m" font-size="15" fill="#0969da">tRPC</text></g>
<g transform="translate(193.20000000000002 198)"><rect width="73" height="30" rx="15.0" fill="#8250df" fill-opacity="0.12" stroke="#8250df" stroke-opacity="0.35"/><text x="36" y="20.4" text-anchor="middle" class="m" font-size="15" fill="#8250df">Docker</text></g>
  <g transform="translate(32 268)">
  <rect width="416" height="160" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="20" y="34" class="t" font-size="18" font-weight="700" fill="#1f2328">Invoice #0042</text>
  <g transform="translate(318 15)"><rect width="78" height="26" rx="13" fill="#1a7f37" fill-opacity="0.14"/><text x="39" y="18" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#1a7f37">PAID</text></g>
  <line x1="20" y1="54" x2="396" y2="54" stroke="#d1d9e0"/>
  <text x="20" y="80" class="t" font-size="15" fill="#59636e">Design work</text><text x="396" y="80" text-anchor="end" class="m" font-size="15" fill="#59636e">8 400</text>
  <text x="20" y="104" class="t" font-size="15" fill="#59636e">Hosting</text><text x="396" y="104" text-anchor="end" class="m" font-size="15" fill="#59636e">2 100</text>
  <line x1="20" y1="120" x2="396" y2="120" stroke="#d1d9e0"/>
  <text x="20" y="145" class="t" font-size="15" fill="#59636e">Total incl. VAT</text>
  <text x="396" y="146" text-anchor="end" class="t" font-size="21" font-weight="700" fill="#1f2328">13 125 kr</text>
</g>
</g>
<rect x="0.5" y="0.5" width="479" height="459" rx="15.5" stroke="#d1d9e0"/>
</svg>
