<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e3e6ea"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 60) rotate(140) scale(520 300)">
      <stop stop-color="#0969da" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 300) rotate(-30) scale(420 200)">
      <stop stop-color="#8250df" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="280" rx="16"/></clipPath>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
    .pulse { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .drift { animation: d 14s ease-in-out infinite alternate; }
    @keyframes d { from { transform: translateX(0) } to { transform: translateX(-40px) } }
    @media (prefers-reduced-motion: reduce) { .pulse, .drift { animation: none } }
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="280" fill="#ffffff"/>
    <rect width="1200" height="280" fill="url(#dots)"/>
    <g class="drift"><rect x="-100" width="1400" height="280" fill="url(#glow)"/><rect x="-100" width="1400" height="280" fill="url(#glow2)"/></g>
    <rect width="1200" height="280" fill="url(#fade)"/>
    <circle class="pulse" cx="62" cy="76" r="5" fill="#3fb950"/>
    <text x="78" y="81" class="m" font-size="15" fill="#59636e" letter-spacing="0.5">tielemans.dev</text>
    <text x="56" y="160" class="t" font-size="64" font-weight="700" fill="#1f2328" letter-spacing="-2">Martin Tielemans</text>
    <text x="58" y="208" class="t" font-size="22" fill="#59636e">Full-stack developer, building products end to end.</text>
    <text x="58" y="240" class="m" font-size="14" fill="#59636e" opacity="0.8" letter-spacing="0.5">WEB · iOS · AGENT TOOLING — AALBORG, DK</text>
    <g transform="translate(800 62)">
      <rect width="340" height="156" rx="10" fill="#f6f8fa" fill-opacity="0.85" stroke="#d1d9e0"/>
      <circle cx="18" cy="18" r="5" fill="#ff5f57"/><circle cx="36" cy="18" r="5" fill="#febc2e"/><circle cx="54" cy="18" r="5" fill="#28c840"/>
      <text x="20" y="62" class="m" font-size="15" fill="#1f2328"><tspan fill="#59636e">$</tspan> ship --web --ios</text>
      <text x="20" y="92" class="m" font-size="14" fill="#59636e"><tspan fill="#1a7f37">✓</tspan> designed<tspan x="170"><tspan fill="#1a7f37">✓</tspan> built</tspan></text>
      <text x="20" y="116" class="m" font-size="14" fill="#59636e"><tspan fill="#1a7f37">✓</tspan> tested<tspan x="170"><tspan fill="#1a7f37">✓</tspan> deployed</tspan></text>
      <rect class="pulse" x="20" y="130" width="9" height="16" fill="#1f2328"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="15.5" stroke="#e3e6ea"/>
</svg>
