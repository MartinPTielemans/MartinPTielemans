<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" fill="none">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262d"/></pattern>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(336.0 391.0) scale(240.0 506.00000000000006)">
    <stop stop-color="#f0883e" stop-opacity="0.22"/><stop offset="1" stop-color="#f0883e" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="r"><rect width="480" height="460" rx="16"/></clipPath>
</defs>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  .pulse { animation: p 2.4s ease-in-out infinite; }
  .pulse2 { animation: p 2.4s ease-in-out .8s infinite; }
  .pulse3 { animation: p 2.4s ease-in-out 1.6s infinite; }
  @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .drift { animation: d 16s ease-in-out infinite alternate; }
  @keyframes d { from { transform: translateX(0) } to { transform: translateX(-60px) } }
  .flow { stroke-dasharray: 4 6; animation: f 1.6s linear infinite; }
  @keyframes f { to { stroke-dashoffset: -20 } }
  .blink { animation: b 1.1s steps(1) infinite; }
  @keyframes b { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .pulse, .pulse2, .pulse3, .drift, .flow, .blink { animation: none } }
</style>
<g clip-path="url(#r)">
  <rect width="480" height="460" fill="#0d1117"/>
  <rect width="480" height="460" fill="url(#dots)"/>
  <g class="drift"><rect x="-100" width="680" height="460" fill="url(#glow)"/></g>

  <text x="32" y="56" class="m" font-size="14" fill="#f0883e" letter-spacing="1.5">macOS MENU BAR APP</text>
  <text x="30" y="108" class="t" font-size="44" font-weight="700" fill="#f0f6fc" letter-spacing="-1.4">PackSwitcher</text>
  <text x="32" y="150" class="t" font-size="20" fill="#9198a1">Copy any npm, yarn or bun</text><text x="32" y="176" class="t" font-size="20" fill="#9198a1">command; paste it as pnpm.</text>
  <g transform="translate(32 198)"><rect width="54" height="30" rx="15.0" fill="#f0883e" fill-opacity="0.12" stroke="#f0883e" stroke-opacity="0.35"/><text x="27" y="20.4" text-anchor="middle" class="m" font-size="15" fill="#f0883e">Rust</text></g>
<g transform="translate(94.4 198)"><rect width="64" height="30" rx="15.0" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.35"/><text x="32" y="20.4" text-anchor="middle" class="m" font-size="15" fill="#d29922">Tauri</text></g>
  <g transform="translate(32 268)"><g transform="translate(0 0)">
  <rect width="416" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="16" y="22.5" class="m" font-size="15" fill="#656c76">npm install react</text>
  <line x1="208" y1="36" x2="208" y2="44" stroke="#f0883e" stroke-width="2" class="flow"/>
  <rect y="46" width="416" height="34" rx="8" fill="#f0883e" fill-opacity="0.10" stroke="#f0883e" stroke-opacity="0.5"/>
  <circle class="pulse" cx="18" cy="63" r="4.5" fill="#f0883e"/>
  <text x="34" y="68.5" class="m" font-size="15" fill="#f0f6fc">pnpm add react</text>
</g><g transform="translate(0 96)">
  <rect width="416" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="16" y="22.5" class="m" font-size="15" fill="#656c76">npx create-next-app</text>
  <line x1="208" y1="36" x2="208" y2="44" stroke="#f0883e" stroke-width="2" class="flow"/>
  <rect y="46" width="416" height="34" rx="8" fill="#f0883e" fill-opacity="0.10" stroke="#f0883e" stroke-opacity="0.5"/>
  <circle class="pulse2" cx="18" cy="63" r="4.5" fill="#f0883e"/>
  <text x="34" y="68.5" class="m" font-size="15" fill="#f0f6fc">pnpx create-next-app</text>
</g></g>
</g>
<rect x="0.5" y="0.5" width="479" height="459" rx="15.5" stroke="#30363d"/>
</svg>
