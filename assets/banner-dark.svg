<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262d"/></pattern>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020.0 150.0) scale(600.0 330.0)">
    <stop stop-color="#ab7df8" stop-opacity="0.22"/><stop offset="1" stop-color="#ab7df8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#0d1117" stop-opacity="0.9"/><stop offset="0.55" stop-color="#0d1117" stop-opacity="0.3"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
  <clipPath id="r"><rect width="1200" height="300" rx="16"/></clipPath>
</defs>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  .pulse { animation: p 2.4s ease-in-out infinite; }
  .pulse2 { animation: p 2.4s ease-in-out .8s infinite; }
  .pulse3 { animation: p 2.4s ease-in-out 1.6s infinite; }
  @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .drift { animation: d 16s ease-in-out infinite alternate; }
  @keyframes d { from { transform: translateX(0) } to { transform: translateX(-60px) } }
  .flow { stroke-dasharray: 4 6; animation: f 1.6s linear infinite; }
  @keyframes f { to { stroke-dashoffset: -20 } }
  .blink { animation: b 1.1s steps(1) infinite; }
  @keyframes b { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .pulse, .pulse2, .pulse3, .drift, .flow, .blink { animation: none } }
</style>
<g clip-path="url(#r)">
  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <g class="drift"><rect x="-100" width="1400" height="300" fill="url(#glow)"/></g>

  <rect width="1200" height="300" fill="url(#fade)"/>
  <circle class="pulse" cx="62" cy="68" r="5" fill="#3fb950"/>
  <text x="78" y="73" class="m" font-size="15" fill="#9198a1" letter-spacing="0.5">building at tielemans.dev</text>
  <text x="56" y="152" class="t" font-size="68" font-weight="700" fill="#f0f6fc" letter-spacing="-2.2">Martin Tielemans</text>
  <text x="58" y="198" class="t" font-size="23" fill="#9198a1">I build products end to end, and the tools that</text>
  <text x="58" y="228" class="t" font-size="23" fill="#9198a1">make building them faster.</text>
  <text x="58" y="266" class="m" font-size="13" fill="#656c76" letter-spacing="1">FULL-STACK · iOS · AGENT TOOLING · AALBORG, DK</text>
  <line x1="905" y1="70" x2="1110" y2="92" stroke="#30363d" stroke-width="1"/>
<line x1="905" y1="70" x2="960" y2="214" stroke="#30363d" stroke-width="1"/>
<line x1="1110" y1="92" x2="1085" y2="222" stroke="#30363d" stroke-width="1"/>
