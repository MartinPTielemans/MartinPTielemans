<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262d"/></pattern>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820.0 150.0) scale(500.0 330.0)">
    <stop stop-color="#ab7df8" stop-opacity="0.22"/><stop offset="1" stop-color="#ab7df8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#0d1117" stop-opacity="0.9"/><stop offset="0.55" stop-color="#0d1117" stop-opacity="0.3"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
  <clipPath id="r"><rect width="1000" height="300" rx="16"/></clipPath>
</defs>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  .pulse { animation: p 2.4s ease-in-out infinite; }
  .pulse2 { animation: p 2.4s ease-in-out .8s infinite; }
  .pulse3 { animation: p 2.4s ease-in-out 1.6s infinite; }
  @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .drift { animation: d 16s ease-in-out infinite alternate; }
  @keyframes d { from { transform: translateX(0) } to { transform: translateX(-60px) } }
  .flow { stroke-dasharray: 4 6; animation: f 1.6s linear infinite; }
  @keyframes f { to { stroke-dashoffset: -20 } }
  .blink { animation: b 1.1s steps(1) infinite; }
  @keyframes b { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .pulse, .pulse2, .pulse3, .drift, .flow, .blink { animation: none } }
</style>
<g clip-path="url(#r)">
  <rect width="1000" height="300" fill="#0d1117"/>
  <rect width="1000" height="300" fill="url(#dots)"/>
  <g class="drift"><rect x="-100" width="1200" height="300" fill="url(#glow)"/></g>

  <rect width="1000" height="300" fill="url(#fade)"/>
  <circle class="pulse" cx="52" cy="62" r="6" fill="#3fb950"/>
  <text x="70" y="68" class="m" font-size="17" fill="#9198a1" letter-spacing="0.5">building at tielemans.dev</text>
  <text x="44" y="146" class="t" font-size="64" font-weight="700" fill="#f0f6fc" letter-spacing="-2">Martin Tielemans</text>
  <text x="46" y="192" class="t" font-size="23" fill="#9198a1">I build products end to end, and the</text>
  <text x="46" y="222" class="t" font-size="23" fill="#9198a1">tools that make building them faster.</text>
  <text x="46" y="262" class="m" font-size="15" fill="#656c76" letter-spacing="1">FULL-STACK · iOS · AGENT TOOLING · AALBORG</text>
  <line x1="700" y1="74" x2="900" y2="92" stroke="#30363d" stroke-width="1.2"/>
<line x1="700" y1="74" x2="735" y2="222" stroke="#30363d" stroke-width="1.2"/>
<line x1="900" y1="92" x2="885" y2="226" stroke="#30363d" stroke-width="1.2"/>
<line x1="735" y1="222" x2="885" y2="226" stroke="#30363d" stroke-width="1.2"/>
  <line x1="812" y1="152" x2="700" y2="74" stroke="#4493f8" stroke-opacity="0.6" stroke-width="1.8" class="flow"/>
<line x1="812" y1="152" x2="900" y2="92" stroke="#4493f8" stroke-opacity="0.6" stroke-width="1.8" class="flow"/>
<line x1="812" y1="152" x2="735" y2="222" stroke="#4493f8" stroke-opacity="0.6" stroke-width="1.8" class="flow"/>
<line x1="812" y1="152" x2="885" y2="226" stroke="#4493f8" stroke-opacity="0.6" stroke-width="1.8" class="flow"/>
  <circle cx="812" cy="152" r="36" fill="#4493f8" fill-opacity="0.10" class="pulse"/>
<circle cx="812" cy="152" r="23" fill="#1c2129" stroke="#4493f8" stroke-width="1.8"/>
<path d="M804 151 l5 5 l10 -11" stroke="#4493f8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(656 54)"><rect width="88" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
<circle class="pulse" cx="18" cy="20" r="5" fill="#3fb950"/><text x="32" y="25.5" class="m" font-size="16" fill="#f0f6fc">mac</text></g><g transform="translate(856 72)"><rect width="88" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
<circle class="pulse2" cx="18" cy="20" r="5" fill="#3fb950"/><text x="32" y="25.5" class="m" font-size="16" fill="#f0f6fc">box</text></g><g transform="translate(691 202)"><rect width="88" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
<circle class="pulse3" cx="18" cy="20" r="5" fill="#3fb950"/><text x="32" y="25.5" class="m" font-size="16" fill="#f0f6fc">vps</text></g><g transform="translate(841 206)"><rect width="88" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
<circle class="pulse" cx="18" cy="20" r="5" fill="#3fb950"/><text x="32" y="25.5" class="m" font-size="16" fill="#f0f6fc">ci</text></g>
</g>
<rect x="0.5" y="0.5" width="999" height="299" rx="15.5" stroke="#30363d"/>
</svg>
