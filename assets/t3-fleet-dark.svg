<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262d"/></pattern>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(936.0 102.0) scale(600.0 374.00000000000006)">
    <stop stop-color="#4493f8" stop-opacity="0.22"/><stop offset="1" stop-color="#4493f8" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="r"><rect width="1200" height="340" rx="16"/></clipPath>
</defs>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  .pulse { animation: p 2.4s ease-in-out infinite; }
  .pulse2 { animation: p 2.4s ease-in-out .8s infinite; }
  .pulse3 { animation: p 2.4s ease-in-out 1.6s infinite; }
  @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .drift { animation: d 16s ease-in-out infinite alternate; }
  @keyframes d { from { transform: translateX(0) } to { transform: translateX(-60px) } }
  .flow { stroke-dasharray: 4 6; animation: f 1.6s linear infinite; }
  @keyframes f { to { stroke-dashoffset: -20 } }
  .blink { animation: b 1.1s steps(1) infinite; }
  @keyframes b { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .pulse, .pulse2, .pulse3, .drift, .flow, .blink { animation: none } }
</style>
<g clip-path="url(#r)">
  <rect width="1200" height="340" fill="#0d1117"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <g class="drift"><rect x="-100" width="1400" height="340" fill="url(#glow)"/></g>

  <text x="48" y="74" class="m" font-size="13" fill="#4493f8" letter-spacing="1.5">FEATURED · OPEN SOURCE</text>
  <text x="46" y="128" class="t" font-size="46" font-weight="700" fill="#f0f6fc" letter-spacing="-1.4">T3 Fleet</text>
  <text x="48" y="172" class="t" font-size="19" fill="#9198a1">Keeps every machine you run T3 Code on</text>
  <text x="48" y="198" class="t" font-size="19" fill="#9198a1">identical: version, providers, skills, MCP.</text>
  <text x="48" y="224" class="t" font-size="19" fill="#9198a1">Shows what drifted, then fixes it.</text>
  <g transform="translate(48 262)"><rect width="88" height="24" rx="12" fill="#4493f8" fill-opacity="0.12" stroke="#4493f8" stroke-opacity="0.35"/><text x="44" y="16.5" text-anchor="middle" class="m" font-size="12" fill="#4493f8">TypeScript</text></g>
<g transform="translate(144.0 262)"><rect width="36" height="24" rx="12" fill="#ab7df8" fill-opacity="0.12" stroke="#ab7df8" stroke-opacity="0.35"/><text x="18" y="16.5" text-anchor="middle" class="m" font-size="12" fill="#ab7df8">CLI</text></g>
<g transform="translate(188.2 262)"><rect width="103" height="24" rx="12" fill="#f0883e" fill-opacity="0.12" stroke="#f0883e" stroke-opacity="0.35"/><text x="51" y="16.5" text-anchor="middle" class="m" font-size="12" fill="#f0883e">brew install</text></g>
  <g transform="translate(700 64)"><rect width="452" height="236" rx="12" fill="#161b22" stroke="#30363d"/><text x="20" y="32" class="m" font-size="13" fill="#9198a1"><tspan fill="#656c76">$</tspan> t3-fleet status</text><line x1="0" y1="48" x2="452" y2="48" stroke="#30363d"/><circle class="pulse" cx="26" cy="78" r="4.5" fill="#3fb950"/><text x="42" y="82" class="m" font-size="14" fill="#f0f6fc">mac</text><text x="124" y="82" class="m" font-size="12" fill="#656c76">authority</text><text x="200" y="82" class="m" font-size="12" fill="#9198a1">t3 0.4.2</text><text x="272" y="82" class="m" font-size="12" fill="#9198a1">claude ✓  codex ✓</text><circle class="pulse2" cx="26" cy="118" r="4.5" fill="#3fb950"/><text x="42" y="122" class="m" font-size="14" fill="#f0f6fc">box</text><text x="124" y="122" class="m" font-size="12" fill="#656c76">hub</text><text x="200" y="122" class="m" font-size="12" fill="#9198a1">t3 0.4.2</text><text x="272" y="122" class="m" font-size="12" fill="#9198a1">claude ✓  codex ✓</text><circle class="pulse3" cx="26" cy="158" r="4.5" fill="#d29922"/><text x="42" y="162" class="m" font-size="14" fill="#f0f6fc">omarchy</text><text x="124" y="162" class="m" font-size="12" fill="#656c76">machine</text><text x="200" y="162" class="m" font-size="12" fill="#d29922">t3 0.4.1</text><text x="272" y="162" class="m" font-size="12" fill="#d29922">codex ✗ signed out</text><line x1="0" y1="188" x2="452" y2="188" stroke="#30363d"/><text x="20" y="216" class="m" font-size="13" fill="#f0f6fc"><tspan fill="#4493f8">→</tspan> 2 fixes ready · <tspan fill="#9198a1">t3-fleet fix</tspan><tspan class="blink" fill="#f0f6fc"> ▍</tspan></text></g>
</g>
<rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" stroke="#30363d"/>
</svg>
