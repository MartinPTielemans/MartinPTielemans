<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" fill="none">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262d"/></pattern>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(780.0 96.0) scale(500.0 352.0)">
    <stop stop-color="#4493f8" stop-opacity="0.22"/><stop offset="1" stop-color="#4493f8" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="r"><rect width="1000" height="320" rx="16"/></clipPath>
</defs>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  .pulse { animation: p 2.4s ease-in-out infinite; }
  .pulse2 { animation: p 2.4s ease-in-out .8s infinite; }
  .pulse3 { animation: p 2.4s ease-in-out 1.6s infinite; }
  @keyframes p { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .drift { animation: d 16s ease-in-out infinite alternate; }
  @keyframes d { from { transform: translateX(0) } to { transform: translateX(-60px) } }
  .flow { stroke-dasharray: 4 6; animation: f 1.6s linear infinite; }
  @keyframes f { to { stroke-dashoffset: -20 } }
  .blink { animation: b 1.1s steps(1) infinite; }
  @keyframes b { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .pulse, .pulse2, .pulse3, .drift, .flow, .blink { animation: none } }
</style>
<g clip-path="url(#r)">
  <rect width="1000" height="320" fill="#0d1117"/>
  <rect width="1000" height="320" fill="url(#dots)"/>
  <g class="drift"><rect x="-100" width="1200" height="320" fill="url(#glow)"/></g>

  <text x="44" y="76" class="m" font-size="15" fill="#4493f8" letter-spacing="1.5">FEATURED · OPEN SOURCE</text>
  <text x="42" y="132" class="t" font-size="52" font-weight="700" fill="#f0f6fc" letter-spacing="-1.6">T3 Fleet</text>
  <text x="44" y="176" class="t" font-size="21" fill="#9198a1">Keeps every machine you run T3 Code</text>
  <text x="44" y="204" class="t" font-size="21" fill="#9198a1">on in sync, shows what drifted,</text>
  <text x="44" y="232" class="t" font-size="21" fill="#9198a1">then fixes it.</text>
  <g transform="translate(44 262)"><rect width="109" height="30" rx="15.0" fill="#4493f8" fill-opacity="0.12" stroke="#4493f8" stroke-opacity="0.35"/><text x="54" y="20.4" text-anchor="middle" class="m" font-size="15" fill="#4493f8">TypeScript</text></g>
<g transform="translate(161.0 262)"><rect width="45" height="30" rx="15.0" fill="#ab7df8" fill-opacity="0.12" stroke="#ab7df8" stroke-opacity="0.35"/><text x="23" y="20.4" text-anchor="middle" class="m" font-size="15" fill="#ab7df8">CLI</text></g>
<g transform="translate(214.3 262)"><rect width="91" height="30" rx="15.0" fill="#f0883e" fill-opacity="0.12" stroke="#f0883e" stroke-opacity="0.35"/><text x="45" y="20.4" text-anchor="middle" class="m" font-size="15" fill="#f0883e">Homebrew</text></g>
  <g transform="translate(548 52)"><rect width="408" height="216" rx="12" fill="#161b22" stroke="#30363d"/><text x="22" y="34" class="m" font-size="15" fill="#9198a1"><tspan fill="#656c76">$</tspan> t3-fleet status</text><line x1="0" y1="52" x2="408" y2="52" stroke="#30363d"/><circle class="pulse" cx="28" cy="81" r="5" fill="#3fb950"/><text x="46" y="86" class="m" font-size="16" fill="#f0f6fc">mac</text><text x="154" y="86" class="m" font-size="14" fill="#656c76">authority</text><text x="386" y="86" text-anchor="end" class="m" font-size="14" fill="#3fb950">in sync</text><circle class="pulse2" cx="28" cy="113" r="5" fill="#3fb950"/><text x="46" y="118" class="m" font-size="16" fill="#f0f6fc">box</text><text x="154" y="118" class="m" font-size="14" fill="#656c76">hub</text><text x="386" y="118" text-anchor="end" class="m" font-size="14" fill="#3fb950">in sync</text><circle class="pulse3" cx="28" cy="145" r="5" fill="#d29922"/><text x="46" y="150" class="m" font-size="16" fill="#f0f6fc">omarchy</text><text x="154" y="150" class="m" font-size="14" fill="#656c76">machine</text><text x="386" y="150" text-anchor="end" class="m" font-size="14" fill="#d29922">2 drifted</text><line x1="0" y1="172" x2="408" y2="172" stroke="#30363d"/><text x="22" y="200" class="m" font-size="15" fill="#f0f6fc"><tspan fill="#4493f8">→</tspan> t3-fleet fix<tspan class="blink"> ▍</tspan></text></g>
</g>
<rect x="0.5" y="0.5" width="999" height="319" rx="15.5" stroke="#30363d"/>
</svg>
