  <text x="36" y="152" class="t" font-size="16" fill="#59636e">Copy any npm, yarn, pnpm</text>
  <text x="36" y="174" class="t" font-size="16" fill="#59636e">or bun command; your</text>
  <text x="36" y="196" class="t" font-size="16" fill="#59636e">clipboard gets your one.</text>
  <g transform="translate(36 252)"><rect width="44" height="24" rx="12" fill="#bc4c00" fill-opacity="0.12" stroke="#bc4c00" stroke-opacity="0.35"/><text x="22" y="16.5" text-anchor="middle" class="m" font-size="12" fill="#bc4c00">Rust</text></g>
<g transform="translate(87.6 252)"><rect width="51" height="24" rx="12" fill="#9a6700" fill-opacity="0.12" stroke="#9a6700" stroke-opacity="0.35"/><text x="26" y="16.5" text-anchor="middle" class="m" font-size="12" fill="#9a6700">Tauri</text></g>
  <g transform="translate(316 40)"><g transform="translate(0 20)">
  <rect width="236" height="26" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="10" y="17.5" class="m" font-size="11.5" fill="#818b98">npm install react</text>
  <line x1="118" y1="28" x2="118" y2="40" stroke="#bc4c00" stroke-width="1.5" class="flow"/>
  <rect y="42" width="236" height="26" rx="6" fill="#bc4c00" fill-opacity="0.10" stroke="#bc4c00" stroke-opacity="0.45"/>
  <circle class="pulse" cx="14" cy="55" r="3.5" fill="#bc4c00"/>
  <text x="26" y="59.5" class="m" font-size="11.5" fill="#1f2328">pnpm add react</text>
</g><g transform="translate(0 98)">
  <rect width="236" height="26" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="10" y="17.5" class="m" font-size="11.5" fill="#818b98">npx create-next-app</text>
  <line x1="118" y1="28" x2="118" y2="40" stroke="#bc4c00" stroke-width="1.5" class="flow"/>
  <rect y="42" width="236" height="26" rx="6" fill="#bc4c00" fill-opacity="0.10" stroke="#bc4c00" stroke-opacity="0.45"/>
  <circle class="pulse2" cx="14" cy="55" r="3.5" fill="#bc4c00"/>
  <text x="26" y="59.5" class="m" font-size="11.5" fill="#1f2328">pnpx create-next-app</text>
</g><g transform="translate(0 176)">
  <rect width="236" height="26" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="10" y="17.5" class="m" font-size="11.5" fill="#818b98">yarn build</text>
  <line x1="118" y1="28" x2="118" y2="40" stroke="#bc4c00" stroke-width="1.5" class="flow"/>
  <rect y="42" width="236" height="26" rx="6" fill="#bc4c00" fill-opacity="0.10" stroke="#bc4c00" stroke-opacity="0.45"/>
  <circle class="pulse3" cx="14" cy="55" r="3.5" fill="#bc4c00"/>
  <text x="26" y="59.5" class="m" font-size="11.5" fill="#1f2328">pnpm run build</text>
</g></g>
</g>
<rect x="0.5" y="0.5" width="589" height="339" rx="15.5" stroke="#d1d9e0"/>
</svg>
