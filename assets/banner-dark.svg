<line x1="905" y1="70" x2="1085" y2="222" stroke="#30363d" stroke-width="1"/>
  <line x1="1020" y1="150" x2="905" y2="70" stroke="#4493f8" stroke-opacity="0.55" stroke-width="1.5" class="flow"/>
<line x1="1020" y1="150" x2="1110" y2="92" stroke="#4493f8" stroke-opacity="0.55" stroke-width="1.5" class="flow"/>
<line x1="1020" y1="150" x2="960" y2="214" stroke="#4493f8" stroke-opacity="0.55" stroke-width="1.5" class="flow"/>
<line x1="1020" y1="150" x2="1085" y2="222" stroke="#4493f8" stroke-opacity="0.55" stroke-width="1.5" class="flow"/>
  <circle cx="1020" cy="150" r="30" fill="#4493f8" fill-opacity="0.10" class="pulse"/>
<circle cx="1020" cy="150" r="19" fill="#1c2129" stroke="#4493f8" stroke-width="1.5"/>
<path d="M1014 149 l4 4 l8 -9" stroke="#4493f8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(867 53)"><rect width="76" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
<circle class="pulse" cx="15" cy="17" r="4" fill="#3fb950"/><text x="27" y="21.5" class="m" font-size="13" fill="#f0f6fc">mac</text></g><g transform="translate(1072 75)"><rect width="76" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
<circle class="pulse2" cx="15" cy="17" r="4" fill="#3fb950"/><text x="27" y="21.5" class="m" font-size="13" fill="#f0f6fc">box</text></g><g transform="translate(922 197)"><rect width="76" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
<circle class="pulse3" cx="15" cy="17" r="4" fill="#3fb950"/><text x="27" y="21.5" class="m" font-size="13" fill="#f0f6fc">vps</text></g><g transform="translate(1047 205)"><rect width="76" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
<circle class="pulse" cx="15" cy="17" r="4" fill="#3fb950"/><text x="27" y="21.5" class="m" font-size="13" fill="#f0f6fc">ci</text></g>
</g>
